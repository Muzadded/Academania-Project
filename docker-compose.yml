services:
  postgres:
    image: postgres:16-alpine
    container_name: academania-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: academania
      POSTGRES_PASSWORD: academania
      POSTGRES_DB: academania
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U academania -d academania']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: academania-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://academania:academania@postgres:5432/academania?schema=public
      NODE_ENV: development
      PORT: 3001
    ports:
      - '3001:3001'
    volumes:
      - ./Backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: academania-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
